apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: fluent-bit
    meta.helm.sh/release-namespace: fluentbit1
  labels:
    app.kubernetes.io/instance: fluent-bit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/version: 3.0.0
    helm.sh/chart: fluent-bit-0.42.0
  name: fluent-bit-sampling
  namespace: fluentbit
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: fluent-bit-sampling
      app.kubernetes.io/name: fluent-bit-sampling
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: fluent-bit-sampling
        app.kubernetes.io/name: fluent-bit-sampling
    spec:
      containers:
        - args:
            - --workdir=/fluent-bit/etc
            - --config=/fluent-bit/etc/conf/fluent-bit.yaml
          command:
            - /fluent-bit/bin/fluent-bit
          image: edsiper/fluent-bit:4.0.3-sampling-reconcile-fix-2
          imagePullPolicy: Always
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: dynatrace
                  key: clusterid
            - name: CLUSTERNAME
              valueFrom:
                secretKeyRef:
                  name: dynatrace
                  key: clustername
            - name: DT_ENDPOINT_HOST
              valueFrom:
                secretKeyRef:
                  name: dynatrace
                  key: dynatrace_oltp_host
            - name: DT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynatrace
                  key: dt_api_token
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
          livenessProbe:
            failureThreshold: 7
            httpGet:
              path: /
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 8
          name: fluent-bit
          ports:
            - containerPort: 2020
              name: http
              protocol: TCP
            - containerPort: 2021
              name: prom
              protocol: TCP
            - containerPort: 4318
              name: otelhttp
              protocol: TCP
            - containerPort: 4317
              name: otel
              protocol: TCP
          readinessProbe:
            failureThreshold: 9
            httpGet:
              path: /api/v1/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 9
          volumeMounts:
            - mountPath: /fluent-bit/etc/conf
              name: config
            - mountPath: /etc/machine-id
              name: etcmachineid
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Always
      serviceAccount: fluent-bit
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: fluent-bit-sampling
          name: config
        - hostPath:
            path: /etc/machine-id
            type: File
          name: etcmachineid
