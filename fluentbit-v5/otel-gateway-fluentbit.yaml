# Gateway for Variant C (Fluent Bit v5). Receives the OTLP/HTTP stream Fluent
# Bit's `opentelemetry` output sends, and drops it (nop) to isolate transport.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway-fluentbit
  namespace: default
spec:
  mode: statefulset
  replicas: 1
  image: otel/opentelemetry-collector-contrib:0.154.0
  ports:
    - name: otlp-http
      port: 4318
      protocol: TCP
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      nop: {}
    service:
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [nop]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
