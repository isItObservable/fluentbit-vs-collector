# ============================================================================
# BENCHMARK VARIANT C — Fluent Bit v5 (third-party log shipper)
# ----------------------------------------------------------------------------
# Tails the SAME host pod logs as Variants A/B, enriches with Kubernetes
# metadata (the kubernetes filter ~= k8sattributesprocessor), and ships to a
# gateway over the OTLP/HTTP `opentelemetry` output — the OTel-native path so
# the comparison stays about transport, not schema.
#
# Scope note (ISI-1779): NO tail sampling. The v4 episode compared Fluent Bit's
# tail-sampling build against the collector's tail_sampling processor; OTAP is a
# TRANSPORT feature, not a sampling one, so tail sampling is out of scope here.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: default
  labels:
    app: fluent-bit-v5
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             5
        Daemon            Off
        Log_Level         info
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         2020
        Health_Check      On
        storage.metrics   On

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/pods/*/*/*.log
        multiline.parser  cri
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.pods.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # Stamp the same cluster attribute the collector variants add via `resource`.
    [FILTER]
        Name       modify
        Match      kube.*
        Add        k8s.cluster.name observable-otelarrow

    # REALISTIC PROCESSING (ISI-1779, feature-parity): the Fluent Bit equivalent
    # of the collector variants' OTTL `transform/redact` — same three operations
    # (normalize severity, redact e-mail PII, drop the file-path key) so all
    # three shippers do identical transformation work and the benchmark reflects
    # a real pipeline's CPU cost, not a bare tail+ship.
    [FILTER]
        Name       lua
        Match      kube.*
        script     redact.lua
        call       redact

    [OUTPUT]
        Name              opentelemetry
        Match             *
        Host              otel-gateway-fluentbit-collector.default.svc.cluster.local
        Port              4318
        Logs_uri          /v1/logs
        Tls               Off
        # Baseline: no gzip (matches an uncompressed OTLP send). Add
        # `compress gzip` to measure Fluent Bit's compressed wire cost as a
        # second data point. (The plugin rejects `compress Off` — omit instead.)

  # Lua equivalent of the collector variants' OTTL transform/redact — mounted at
  # /fluent-bit/etc/redact.lua (same configmap dir as fluent-bit.conf).
  redact.lua: |
    function redact(tag, ts, record)
        local msg = record["log"] or record["message"] or ""
        local lower = string.lower(msg)
        -- 1. normalize severity from the message body
        if string.find(lower, "error") or string.find(lower, "exception")
           or string.find(lower, "panic") or string.find(lower, "fatal") then
            record["severity_text"] = "ERROR"
        elseif string.find(lower, "warn") then
            record["severity_text"] = "WARN"
        else
            record["severity_text"] = "INFO"
        end
        -- 2. redact e-mail PII in the body
        if record["log"] ~= nil then
            record["log"] = string.gsub(record["log"],
                "[%w._%%+-]+@[%w.-]+%.%a%a+", "***@redacted")
        end
        -- 3. drop the high-cardinality file-path key (parity with delete_key)
        record["log.file.path"] = nil
        -- return code 2 = record modified
        return 2, ts, record
    end
