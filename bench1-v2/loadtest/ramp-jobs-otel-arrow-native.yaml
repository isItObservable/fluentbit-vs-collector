      annotations: { sidecar.istio.io/inject: "false" }
    spec:
      restartPolicy: Never
      initContainers: [ { name: wait, image: busybox:1.36, command: ["sh","-c","sleep 0"] } ]
      containers:
        - name: loadgen
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator:v0.10.2
          command: ["locust","--host=http://frontend:80","--headless","-u","50","-r","5","--run-time","7200s","--exit-code-on-error","0"]
          resources: { requests: { cpu: "200m", memory: "256Mi" }, limits: { memory: "1Gi" } }
