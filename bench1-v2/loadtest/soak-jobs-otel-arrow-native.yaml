# ============================================================================
# ISI-1881 / ISI-1779 B1-v2 — 24h SOAK load, ENGINE = otel-arrow-native
# ----------------------------------------------------------------------------
#   kubectl apply -f loadtest/soak-jobs-otel-arrow-native.yaml
#
# Two Jobs: one for otel-demo, one for hipster-shop. Both run LOAD_PHASE=leak24h
# (50 VU/app constant, 86400s = 24h). Same loadshape.py as the ramp jobs.
#
# IMAGE: ghcr.io/open-telemetry/demo:2.2.0-load-generator
# (confirmed pullable; loadgenerator:1.12.0 from opentelemetry-demo/loadgenerator
#  returns 403 Forbidden and was replaced during attempt 1 — ISI-1881 comment e9e436e6)
#
# LOAD-BEARING properties (same discipline as ramp-jobs-*.yaml):
#  1. `soak: isi1779` on the POD TEMPLATE (for capture-window.sh + census)
#  2. NO `ttlSecondsAfterFinished` — pods must survive for END timestamp recovery
#  3. `backoffLimit: 0` — no automatic retry on failure; failure is explicit
#  4. `activeDeadlineSeconds: 90000` — ~25h hard cap (24h + 1h buffer) so the
#     Job terminates even if loadgen hangs at the end of the window
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: soakjob-oteldemo
  namespace: otel-demo
  labels:
    soak: isi1779
    engine: otel-arrow-native
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90000
  template:
    metadata:
      labels:
        soak: isi1779
        engine: otel-arrow-native
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: ghcr.io/open-telemetry/demo:2.2.0-load-generator
          env:
            - name: LOCUST_HOST
              value: "http://frontend-proxy.otel-demo:8080"
            - name: LOAD_PHASE
              value: "leak24h"
            - name: LOCUST_USERS
              value: "50"
            - name: LOCUST_EXIT_CODE_ON_ERROR
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://bench-otel-arrow-native.default:4318"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: soakjob-hipster
  namespace: hipster-shop
  labels:
    soak: isi1779
    engine: otel-arrow-native
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90000
  template:
    metadata:
      labels:
        soak: isi1779
        engine: otel-arrow-native
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: ghcr.io/open-telemetry/demo:2.2.0-load-generator
          env:
            - name: LOCUST_HOST
              value: "http://frontend.hipster-shop:80"
            - name: LOAD_PHASE
              value: "leak24h"
            - name: LOCUST_USERS
              value: "50"
            - name: LOCUST_EXIT_CODE_ON_ERROR
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://bench-otel-arrow-native.default:4318"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
