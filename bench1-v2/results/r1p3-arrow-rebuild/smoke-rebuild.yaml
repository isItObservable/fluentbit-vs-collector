apiVersion: v1
kind: Namespace
metadata:
  name: dfsmoke
  labels: { isi: '1879', purpose: arrow-rebuild-smoke }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: fanout-config, namespace: dfsmoke }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    exporters:
      otlp/old:
        endpoint: engine-old.dfsmoke.svc.cluster.local:4317
        tls: { insecure: true }
      otlp/new:
        endpoint: engine-new.dfsmoke.svc.cluster.local:4317
        tls: { insecure: true }
    service:
      telemetry:
        logs: { level: warn }
      pipelines:
        traces:  { receivers: [otlp], exporters: [otlp/old, otlp/new] }
        metrics: { receivers: [otlp], exporters: [otlp/old, otlp/new] }
        logs:    { receivers: [otlp], exporters: [otlp/old, otlp/new] }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanout
  namespace: dfsmoke
spec:
  replicas: 1
  selector: { matchLabels: { app: fanout } }
  template:
    metadata:
      labels: { app: fanout }
      annotations: { dynatrace.com/inject: 'false' }
    spec:
      containers:
      - name: otelcol
        image: otel/opentelemetry-collector-contrib:0.154.0
        args: [ "--config", "/etc/otelcol/config.yaml" ]
        ports: [ { containerPort: 4317 }, { containerPort: 4318 } ]
        resources: { requests: { cpu: 100m, memory: 128Mi } }
        volumeMounts: [ { name: cfg, mountPath: /etc/otelcol, readOnly: true } ]
      volumes:
      - name: cfg
        configMap: { name: fanout-config }
---
apiVersion: v1
kind: Service
metadata: { name: fanout, namespace: dfsmoke }
spec:
  selector: { app: fanout }
  ports:
  - { name: grpc-otlp, appProtocol: grpc, port: 4317, targetPort: 4317 }
  - { name: http-otlp, appProtocol: http, port: 4318, targetPort: 4318 }

---
apiVersion: v1
kind: ConfigMap
metadata: { name: sink-old-config, namespace: dfsmoke }
data:
  config.yaml: |
    receivers:
