# ============================================================================
# ISI-1817 — ATTRIBUTE-LANDING PROBE for df_engine 0.50.0
# ----------------------------------------------------------------------------
# QUESTION: does `processor:attribute` upsert land on ALL THREE signals?
#
# CHECK 5b (as of c4fe469) asserts span and log liveness on
# `benchmark.engine == "otel-arrow-native"`. That attribute is written by the
# engine's own attribute processor. If df_engine 0.50.0 upserts on logs but
# silently skips traces or metrics — exactly the failure R1P2 exhibited for
# `k8s.cluster.name` on Fluent Bit logs — the gate false-FAILs on a healthy
# engine and voids the arm. R1P2 proved that failure mode is real for ONE
# engine and ONE signal; nothing proves df_engine is free of it.
#
# WHERE THIS RUNS: cluster `observable-agentsandbox` — NOT the measured
# cluster. The measured cluster is mid-R1P2 and its telemetry config is
# frozen. This probe answers the question without spending a minute of
# benchmark cluster time and without touching a frozen config.
#
# WHAT IS IDENTICAL TO THE FROZEN CONFIG: version/engine/groups/policies, the
# receiver, `enrich` (the processor under test, verbatim), `parity`, `batch`,
# and the connections graph. WHAT DIFFERS: the exporter endpoint points at a
# local debug sink instead of Dynatrace, and the Authorization header carries
# a dummy value. Nothing about the attribute processor is altered — the
# exporter is downstream of it.
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: dfprobe
  labels: { isi: "1817", purpose: attr-landing-probe }
---
# ----------------------------------------------------------------------------
# SINK — plain OTLP receiver -> debug exporter. Prints every resource and
# record attribute it receives, so what df_engine EMITS is read directly off
# the wire rather than inferred from a backend query.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata: { name: sink-config, namespace: dfprobe }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:  { receivers: [otlp], exporters: [debug] }
        metrics: { receivers: [otlp], exporters: [debug] }
        logs:    { receivers: [otlp], exporters: [debug] }
      telemetry:
        logs: { level: info }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sink, namespace: dfprobe }
spec:
  replicas: 1
  selector: { matchLabels: { app: sink } }
  template:
    metadata: { labels: { app: sink } }
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.154.0
          args: ["--config", "/etc/otelcol/config.yaml"]
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
          volumeMounts:
            - { name: cfg, mountPath: /etc/otelcol, readOnly: true }
      volumes:
        - name: cfg
          configMap: { name: sink-config }
---
apiVersion: v1
kind: Service
metadata: { name: sink, namespace: dfprobe }
spec:
  selector: { app: sink }
  ports:
    - { name: grpc-otlp, appProtocol: grpc, port: 4317, targetPort: 4317 }
    - { name: http-otlp, appProtocol: http, port: 4318, targetPort: 4318 }
---
# ----------------------------------------------------------------------------
# DF_ENGINE — the config below is the frozen template with ONLY the two
# exporter lines changed (endpoint -> sink, token -> dummy).
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata: { name: df-probe-config, namespace: dfprobe }
data:
  config.yaml: |
    version: otel_dataflow/v1
    engine: {}
    groups:
      default:
        pipelines:
          main:
            policies:
              channel_capacity:
                control: { node: 100, pipeline: 100 }
                pdata: 128
            nodes:
              otlp_in:
                type: receiver:otlp
                config:
                  protocols:
                    grpc: { listening_addr: 0.0.0.0:4317 }
                    http: { listening_addr: 0.0.0.0:4318 }

              enrich:
                type: processor:attribute
                config:
                  actions:
                    - { key: benchmark.engine, action: upsert, value: otel-arrow-native }
                    - { key: k8s.cluster.name, action: upsert, value: observable-otelarrow }
                    - { key: benchmark.run,    action: upsert, value: isi1779-b1v2 }

              parity:
                type: processor:transform
                config:
                  kql_query: "logs | extend severity_text = 'ERROR'"

              batch:
                type: processor:batch
                config:
                  otap: { min_size: 1000, sizer: items }
                  max_batch_duration: 3s

              dt_out:
                type: exporter:otlp_http
                config:
                  endpoint: http://sink.dfprobe.svc.cluster.local:4318
                  client_pool_size: 4
                  http:
                    headers:
                      Authorization: "Api-Token PROBE-DUMMY-VALUE-NOT-A-TOKEN"

            connections:
              - { from: otlp_in, to: enrich }
              - { from: enrich,  to: parity }
              - { from: parity,  to: batch }
              - { from: batch,   to: dt_out }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: df-engine, namespace: dfprobe }
spec:
  replicas: 1
  selector: { matchLabels: { app: df-engine } }
  template:
    metadata: { labels: { app: df-engine } }
    spec:
      containers:
        - name: df-engine
          image: ghcr.io/isitobservable/df_engine:0.50.0
          args:
            - "--config"
            - "file:/etc/df-engine/config.yaml"
            - "--http-admin-bind"
            - "0.0.0.0:8080"
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
            - { containerPort: 8080 }
          volumeMounts:
            - { name: cfg, mountPath: /etc/df-engine, readOnly: true }
      volumes:
        - name: cfg
          configMap: { name: df-probe-config }
---
apiVersion: v1
kind: Service
metadata: { name: df-engine, namespace: dfprobe }
spec:
  selector: { app: df-engine }
  ports:
    - { name: grpc-otlp, appProtocol: grpc, port: 4317, targetPort: 4317 }
    - { name: http-otlp, appProtocol: http, port: 4318, targetPort: 4318 }
    - { name: admin, port: 8080, targetPort: 8080 }
