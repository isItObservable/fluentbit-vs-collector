# Locust load driver for otel-demo. Scripts come from ConfigMap
# `loadtest-scripts` (created from *.py by run-benchmark.sh --from-file).
# LOAD_PHASE is flipped per phase by the orchestrator (kubectl set env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-otel-demo
  namespace: default
  labels:
    app.kubernetes.io/name: loadgen-otel-demo
    app.kubernetes.io/part-of: isi1779-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen-otel-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen-otel-demo
        app.kubernetes.io/part-of: isi1779-benchmark
      annotations:
        oneagent.dynatrace.com/inject: "false"
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.31.8
          workingDir: /loadtest
          args:
            - "-f"
            - "/loadtest/tasks_otel_demo.py"
            - "--headless"
            - "--host"
            - "http://frontend-proxy.otel-demo:8080"
          env:
            - name: LOAD_PHASE
              value: "stable30"
            - name: BASE_USERS
              value: "50"
            - name: STEP_USERS
              value: "50"
            - name: STEP_SECS
              value: "1800"
            - name: SPAWN_RATE
              value: "5"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /loadtest
      volumes:
        - name: scripts
          configMap:
            name: loadtest-scripts
