# Copy to dynatrace-secret.yaml and fill in YOUR Dynatrace tenant URL + tokens.
# dynatrace-secret.yaml is git-ignored — NEVER commit real credentials.
#
#   kubectl create ns dynatrace --dry-run=client -o yaml | kubectl apply -f -
#   cp dynatrace-secret.example.yaml dynatrace-secret.yaml   # edit the values
#   kubectl -n dynatrace apply -f dynatrace-secret.yaml
#
# This single Secret is referenced by BOTH:
#   - the DynaKube CR (10-dynakube.yaml, `tokens: benchmark-cluster`) for pod
#     resource monitoring, and
#   - every engine's OTLP exporter (secretKeyRef name: benchmark-cluster,
#     key: dataIngestToken) for the actual telemetry export.
# The name must match BACKEND_SECRET in deploy-arm.sh (default: benchmark-cluster).
apiVersion: v1
kind: Secret
metadata:
  name: benchmark-cluster
  namespace: dynatrace
type: Opaque
stringData:
  apiUrl: "https://<YOUR_TENANT>.live.dynatrace.com/api"
  # Token with the ActiveGate/Kubernetes-monitoring scopes the DynaKube needs:
  apiToken: "<YOUR_API_TOKEN>"
  # Token with the "Ingest OpenTelemetry" / metrics+logs+traces ingest scopes,
  # used by the engine OTLP exporters (Authorization: Api-Token <dataIngestToken>):
  dataIngestToken: "<YOUR_DATA_INGEST_TOKEN>"
