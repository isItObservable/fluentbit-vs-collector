# ============================================================================
# B1-v2 — otel-demo Helm values, ENGINE = @@ENGINE@@
# ----------------------------------------------------------------------------
# GENERATED FROM _templates/otel-demo-values.tmpl.yaml by render.sh — DO NOT EDIT.
# Chart: open-telemetry/opentelemetry-demo 0.40.10 (appVersion 2.2.0) — the
# version already installed on the benchmark cluster.
#
#   helm upgrade --install otel-demo open-telemetry/opentelemetry-demo \
#     --version 0.40.10 -n otel-demo --create-namespace \
#     -f apps/otel-demo-values-@@ENGINE@@.yaml --wait
#
# ---------------------------------------------------------------------------
# HOW THE OTLP ENDPOINT IS REPOINTED
# ---------------------------------------------------------------------------
# The chart wires every component with
#     OTEL_EXPORTER_OTLP_ENDPOINT = http://$(OTEL_COLLECTOR_NAME):4317
# so overriding the single variable OTEL_COLLECTOR_NAME in default.envOverrides
# repoints all ~20 services at once. That is the chart's own indirection, not
# a hack — and it is why the endpoint diff between the three phases is one line.
#
# ---------------------------------------------------------------------------
# SIDECAR EXCLUSIONS (validation gate check 3)
# ---------------------------------------------------------------------------
# Exactly two components are excluded from injection:
#   load-generator  — Locust; the sidecar intercepts and re-times the very
#                     traffic we are using as the independent variable, and it
#                     would attribute load-driver latency to the mesh.
#   frontend-proxy  — is itself an Envoy; sidecar-in-front-of-Envoy double-
#                     proxies every request into the demo and breaks the
#                     browser-facing 8080 listener.
# podAnnotations is deep-merged by Helm, so the chart's own annotations on
# these two components (resource.opentelemetry.io/service.namespace, the
# io.opentelemetry.discovery.metrics/* set on frontend-proxy) are preserved.
# EVERYTHING ELSE gets a sidecar — that is what the gate asserts.
# ============================================================================

default:
  envOverrides:
    # Dynatrace REJECTS cumulative Sum, cumulative Histogram and
    # Summary with HTTP 400 "The message is malformed" — proven live against
    # the Dynatrace tenant by sending one datapoint of each type through an isolated probe
    # collector (delta Sum, Gauge and delta Histogram are accepted; the
    # rejection is temporality, not a degenerate start/end interval, which was
    # controlled for). The otel-demo chart ships
    # OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=cumulative on all ~20
    # services, so every cumulative point it emits is permanently dropped at
    # the tenant and never reaches the dashboard.
    # Fixed at the SOURCE rather than in an engine pipeline: filtering by
    # metric type would have to be reimplemented per engine (Fluent Bit and
    # df_engine have no equivalent of OTTL metric.type), which would give the
    # three engines unequal processing work and break plan section 2.
    #
    # LIVED IN THE RENDERED FILES ONLY UNTIL 2026-07-23 . It was
    # hand-added to all three apps/otel-demo-values-*.yaml during R1P1 and never
    # back-ported here, so `./render.sh` silently DELETED it — and `--check`
    # reported the drift as the rendered files being wrong, not the template.
    # Re-rendering mid-campaign would have stripped the metrics arm of every
    # remaining phase. Keep template and rendered output in sync.
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    # single lever: repoints OTEL_EXPORTER_OTLP_ENDPOINT for every component
    - name: OTEL_COLLECTOR_NAME
      value: @@ENGINE_SVC@@
    # tag every record so DT can attribute volume to the phase without
    # relying on wall-clock windows alone
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: benchmark.engine=@@ENGINE@@,benchmark.run=logship-b1v2,service.namespace=otel-demo

components:
  # DO NOT try to silence otel-demo `currency` from the environment. It is C++,
  # and the OTel C++ SDK builds its meter provider programmatically: it ignores
  # BOTH `OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE` and
  # `OTEL_METRICS_EXPORTER`. Verified live, twice, on this cluster -- each var
  # was confirmed present on the running pod and currency kept exporting
  # CUMULATIVE Sums, which this tenant rejects with `400 The message is
  # malformed`. It is the sole remaining source of those rejections
  # (2 points/min, identical on all three engines by construction).
  #
  # Identified by phase-matching rather than guessing: the failures arrive as
  # exactly 2 dropped points on a 60s phase-locked cadence, and the cadence
  # second tracks currency's container start second across three separate
  # restarts (:36 <- 14:56:35Z, :16 <- 15:14:16Z, :09 <- 15:21:08Z).
  #
  # Filtering it out in an engine pipeline would break plan section 2 -- Fluent
  # Bit and df_engine have no equivalent of OTTL `metric.type`, so the three
  # engines would do unequal processing work. Raised as an open question in 
  # as a CHECK 5 policy decision.
  load-generator:
    podAnnotations:
      sidecar.istio.io/inject: "false"
  frontend-proxy:
    podAnnotations:
      sidecar.istio.io/inject: "false"

# The demo's bundled observability backends are all off — the engine under
# test is the only telemetry path, and a second consumer would distort load.
grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false
prometheus:
  enabled: false
opentelemetry-collector:
  enabled: false
