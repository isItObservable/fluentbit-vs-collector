# Tier 4 CONTROL ARM (ARM 2) = Fluent Bit v5.1.1 — logs+metrics+traces, NO tail sampling.
# SERIAL SINGLE-ENGINE (serial single-engine): deployed AFTER the collector arm is fully torn down (the Fluent Bit control run). Fluent Bit has NO tail-sampling processor, so the FB arm runs the
# T3-shaped full-stack trace load and serves as the no-TS CONTROL that isolates the collector's
# T3->T4 tail-sampling delta (CPU/mem/decision-buffer cost lives on the collector arm only).
# Config is byte-identical to the Tier 3 FB arm except the tier tag bump (tier4-*): frozen pins
# FB v5.1.1 / Kepler 0.8.0 / collector v0.159.0 (no-drift rule).
#
# ⚠️ T3-resolved launch item, applied here: telemetrygen targets bench-fluentbit-otlp:4317, which the
# Service maps to targetPort 4318, and MUST run with `--otlp-http` (FB `opentelemetry` INPUT is
# OTLP/HTTP-first; gRPC does not bind on v5.1.1). tier4-arm2-driver.sh adds the flag and confirms
# span ingest via fluentbit_input_records_total on the traces pod BEFORE committing T0.
apiVersion: v1
kind: Namespace
metadata:
  name: bench-fluentbit
  labels:
    oneagent: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-fluentbit
  namespace: bench-fluentbit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bench-fluentbit
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bench-fluentbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bench-fluentbit
subjects:
  - kind: ServiceAccount
    name: bench-fluentbit
    namespace: bench-fluentbit
---
# --- LOGS pipeline config (DaemonSet) — identical to T3 FB arm, tier tag -> tier4 ------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-fluentbit-logs-config
  namespace: bench-fluentbit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Log_Level info
        Daemon off
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        storage.metrics On

    [INPUT]
        Name tail
        Tag kube.*
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/*bench-fluentbit*.log
        multiline.parser cri
        Read_from_Head false
        Skip_Long_Lines On
        Refresh_Interval 5

    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        Buffer_Size 1M

    [FILTER]
        Name record_modifier
        Match kube.*
        Record test.type tier4
        Record benchmark.tier tier4-logs-metrics-traces
        Record benchmark.engine fluentbit
        Record k8s.cluster.name benchmark-cluster

    [OUTPUT]
        Name opentelemetry
        Match kube.*
        Host YOUR_TENANT.live.dynatrace.com
        Port 443
        Logs_URI /api/v2/otlp/v1/logs
        TLS On
        TLS.Verify On
        Header Authorization Api-Token ${DT_API_TOKEN}
        Retry_Limit False
---
# --- METRICS pipeline config (StatefulSet) — identical to T3 FB arm, tier tag -> tier4 ------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-fluentbit-metrics-config
  namespace: bench-fluentbit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Log_Level info
        Daemon off
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        storage.metrics On

    [INPUT]
        Name prometheus_scrape
        Tag metrics.istiod
        Host istiod.istio-system.svc.cluster.local
        Port 15014
        Metrics_Path /metrics
        Scrape_Interval 15s
        buffer_max_size 1M

    [INPUT]
        Name prometheus_scrape
        Tag metrics.kepler
        Host kepler.kepler.svc.cluster.local
        Port 9102
        Metrics_Path /metrics
        Scrape_Interval 15s
        buffer_max_size 1M

    [OUTPUT]
        Name opentelemetry
        Match metrics.*
        Host YOUR_TENANT.live.dynatrace.com
        Port 443
        Metrics_URI /api/v2/otlp/v1/metrics
        TLS On
        TLS.Verify On
        Header Authorization Api-Token ${DT_API_TOKEN}
        add_label test.type tier4
        add_label benchmark.tier tier4-logs-metrics-traces
        add_label benchmark.engine fluentbit
        add_label k8s.cluster.name benchmark-cluster
        Retry_Limit False
---
# --- TRACES pipeline config (Deployment) — TIER-3 DELTA ----------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-fluentbit-traces-config
  namespace: bench-fluentbit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Log_Level info
        Daemon off
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        storage.metrics On

    [INPUT]
        Name opentelemetry
        Tag otel.traces
        Listen 0.0.0.0
        Port 4318

    [FILTER]
        Name record_modifier
        Match otel.*
        Record test.type tier4
        Record benchmark.tier tier4-logs-metrics-traces
        Record benchmark.engine fluentbit
        Record k8s.cluster.name benchmark-cluster

    [OUTPUT]
        Name opentelemetry
        Match otel.*
        Host YOUR_TENANT.live.dynatrace.com
        Port 443
        Traces_URI /api/v2/otlp/v1/traces
        TLS On
        TLS.Verify On
        Header Authorization Api-Token ${DT_API_TOKEN}
        Retry_Limit False
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bench-fluentbit-logs
  namespace: bench-fluentbit
  labels: { app: bench-fluentbit-logs }
spec:
  selector:
    matchLabels: { app: bench-fluentbit-logs }
  template:
    metadata:
      labels: { app: bench-fluentbit-logs }
    spec:
      serviceAccountName: bench-fluentbit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.1
          args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp, key: apiToken } }
          ports:
            - { name: http, containerPort: 2020 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "2", memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
      volumes:
        - name: config
          configMap: { name: bench-fluentbit-logs-config }
        - name: varlog
          hostPath: { path: /var/log }
        - name: varlibdockercontainers
          hostPath: { path: /var/lib/docker/containers }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bench-fluentbit-metrics
  namespace: bench-fluentbit
  labels: { app: bench-fluentbit-metrics }
spec:
  serviceName: bench-fluentbit-metrics
  replicas: 1
  selector:
    matchLabels: { app: bench-fluentbit-metrics }
  template:
    metadata:
      labels: { app: bench-fluentbit-metrics }
    spec:
      serviceAccountName: bench-fluentbit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.1
          args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp, key: apiToken } }
          ports:
            - { name: http, containerPort: 2020 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
      volumes:
        - name: config
          configMap: { name: bench-fluentbit-metrics-config }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-fluentbit-traces
  namespace: bench-fluentbit
  labels: { app: bench-fluentbit-otlp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bench-fluentbit-otlp }
  template:
    metadata:
      labels: { app: bench-fluentbit-otlp }
    spec:
      serviceAccountName: bench-fluentbit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.1
          args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp, key: apiToken } }
          ports:
            - { name: http, containerPort: 2020 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: "2", memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
      volumes:
        - name: config
          configMap: { name: bench-fluentbit-traces-config }
---
apiVersion: v1
kind: Service
metadata:
  name: bench-fluentbit-otlp
  namespace: bench-fluentbit
  labels: { app: bench-fluentbit-otlp }
spec:
  selector: { app: bench-fluentbit-otlp }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4318 } # harness targets :4317; see FB-arm validation note above
    - { name: otlp-http, port: 4318, targetPort: 4318 }
