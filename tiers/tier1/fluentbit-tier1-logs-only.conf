# Tier 1 (LOGS ONLY) Fluent Bit config — ARM 2 (serial single-engine).
# Derived from the setup bench-fluentbit-config by removing the prometheus_scrape (metrics)
# and opentelemetry (traces) inputs. Only the tail->kubernetes logs path runs.
#
# CONFORMANCE FIX (09-04, at ARM-2 launch): the staged conf ended in a null OUTPUT,
# violating the methodology ("engine EXPORTS to Dynatrace; gate = logs RECEIVED IN DYNATRACE").
# Replaced with an opentelemetry OUTPUT to the same DT logs endpoint the collector arm
# used (YOUR_TENANT/api/v2/otlp/v1/logs), token via env DT_API_TOKEN (secret dt-otlp).
# fluentbit_output_proc/dropped/errors_* metrics then serve as the DT-receipt oracle.
[SERVICE]
    Flush 5
    Log_Level info
    Daemon off
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.metrics On

[INPUT]
    Name tail
    Tag kube.*
    Path /var/log/containers/*.log
    Exclude_Path /var/log/containers/*bench-fluentbit*.log
    multiline.parser cri
    Read_from_Head false
    Skip_Long_Lines On
    Refresh_Interval 5

[FILTER]
    Name kubernetes
    Match kube.*
    Merge_Log On
    Keep_Log Off
    # Buffer_Size raised 32k(default)->1M: the filter's apiserver metadata HTTP client
    # hit "cannot increase buffer: max=32000" on large pod-metadata responses, silently
    # truncating k8s enrichment. Raise so Tier-1 log enrichment stays complete over 24h.
    Buffer_Size 1M

[OUTPUT]
    Name opentelemetry
    Match kube.*
    Host YOUR_TENANT.live.dynatrace.com
    Port 443
    Logs_URI /api/v2/otlp/v1/logs
    TLS On
    TLS.Verify On
    # Unquoted (FB value = rest of line); quoted form sends literal quotes -> DT 401 (smoke 09-04).
    Header Authorization Api-Token ${DT_API_TOKEN}
    Retry_Limit False
