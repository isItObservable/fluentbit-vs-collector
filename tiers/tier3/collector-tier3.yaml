# Tier 3 (LOGS + METRICS + TRACES, NO tail sampling) — ARM 1 = otel-collector-contrib v0.159.0.
# SERIAL SINGLE-ENGINE (serial single-engine): only ONE engine live at a time; collector runs first, FB after teardown.
# Tier delta vs Tier 2 = ADD a TRACES pipeline (otlp receiver -> DT traces). Logs + metrics
# pipelines are held IDENTICAL to Tier-2 (cardinal rule: NO version/config drift across tiers;
# frozen pins collector v0.159.0 / FB v5.1.1 / Kepler 0.8.0). NO tail sampling — that is Tier 4.
#
# Topology (mirrors Tier-2 split so the per-engine cost lines stay comparable):
# - DaemonSet bench-collector-logs : filelog node tail -> DT logs
# - StatefulSet bench-collector-metrics : prometheus scrape istiod(:15014)+Kepler(:9102),
# cumulative->delta, drop-summary -> DT metrics
# - Deployment bench-collector-traces : OTLP receiver (4317/4318) -> DT traces [TIER-3 DELTA]
# - Service bench-collector-otlp : fronts the traces Deployment; telemetrygen @200 span/s
# targets bench-collector-otlp...:4317 (run-profile.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: bench-collector
  labels:
    oneagent: "false" # Note: keep OneAgent OUT of engine-under-test ns
    benchmark: fluentbit-vs-collector
    engine: otel-collector-contrib
    kubernetes.io/metadata.name: bench-collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-collector
  namespace: bench-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bench-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "nodes/proxy", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "daemonsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bench-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bench-collector
subjects:
  - kind: ServiceAccount
    name: bench-collector
    namespace: bench-collector
---
# --- LOGS pipeline config (DaemonSet) — held identical to Tier-1/Tier-2 -------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-collector-logs-config
  namespace: bench-collector
data:
  config.yaml: |
    receivers:
      filelog:
        include: [ /var/log/pods/*/*/*.log ]
        exclude: [ /var/log/pods/bench-collector_*/*/*.log ]
        start_at: end
        include_file_path: true
        operators:
          - type: container
            id: container-parser
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [ k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.container.name ]
      resource/ident:
        attributes:
          - { key: benchmark.tier, value: "tier3-logs-metrics-traces", action: upsert }
          - { key: benchmark.engine, value: "collector", action: upsert }
          - { key: k8s.cluster.name, value: "benchmark-cluster", action: upsert }
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15
      batch:
        send_batch_size: 8192
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 1000
      otlphttp/dynatrace:
        logs_endpoint: https://YOUR_TENANT.live.dynatrace.com/api/v2/otlp/v1/logs
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        retry_on_failure: { enabled: true }
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
      pipelines:
        logs:
          receivers: [ filelog ]
          processors: [ memory_limiter, k8sattributes, resource/ident, batch ]
          exporters: [ debug, otlphttp/dynatrace ]
---
# --- METRICS pipeline config (StatefulSet) — held identical to Tier-2 ---------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-collector-metrics-config
  namespace: bench-collector
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: istio-control-plane
              scrape_interval: 15s
              kubernetes_sd_configs: [ { role: pod, namespaces: { names: [ istio-system ] } } ]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "15014"
            - job_name: kepler
              scrape_interval: 15s
              kubernetes_sd_configs: [ { role: pod, namespaces: { names: [ kepler ] } } ]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "9102"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15
      cumulativetodelta: {}
      filter/drop_summary:
        error_mode: ignore
        metrics:
          metric:
            - 'type == METRIC_DATA_TYPE_SUMMARY'
      resource/ident:
        attributes:
          - { key: benchmark.tier, value: "tier3-logs-metrics-traces", action: upsert }
          - { key: benchmark.engine, value: "collector", action: upsert }
          - { key: k8s.cluster.name, value: "benchmark-cluster", action: upsert }
      batch:
        send_batch_size: 8192
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 1000
      otlphttp/dynatrace:
        metrics_endpoint: https://YOUR_TENANT.live.dynatrace.com/api/v2/otlp/v1/metrics
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        retry_on_failure: { enabled: true }
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
      pipelines:
        metrics:
          receivers: [ prometheus ]
          processors: [ memory_limiter, cumulativetodelta, filter/drop_summary, resource/ident, batch ]
          exporters: [ debug, otlphttp/dynatrace ]
---
# --- TRACES pipeline config (Deployment) — TIER-3 DELTA -----------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-collector-traces-config
  namespace: bench-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [ k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.container.name ]
      resource/ident:
        attributes:
          - { key: benchmark.tier, value: "tier3-logs-metrics-traces", action: upsert }
          - { key: benchmark.engine, value: "collector", action: upsert }
          - { key: k8s.cluster.name, value: "benchmark-cluster", action: upsert }
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15
      batch:
        send_batch_size: 8192
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 1000
      # NO tail sampling (Tier 4 owns that) — this is the clean full-fidelity traces export.
      otlphttp/dynatrace:
        traces_endpoint: https://YOUR_TENANT.live.dynatrace.com/api/v2/otlp/v1/traces
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        retry_on_failure: { enabled: true }
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
      pipelines:
        traces:
          receivers: [ otlp ]
          processors: [ memory_limiter, k8sattributes, resource/ident, batch ]
          exporters: [ debug, otlphttp/dynatrace ]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bench-collector-logs
  namespace: bench-collector
  labels: { app: bench-collector-logs, engine: otel-collector-contrib }
spec:
  selector:
    matchLabels: { app: bench-collector-logs }
  template:
    metadata:
      labels: { app: bench-collector-logs, engine: otel-collector-contrib }
    spec:
      serviceAccountName: bench-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: [ "--config=/conf/config.yaml" ]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp, key: apiToken } }
          ports:
            - { name: metrics, containerPort: 8888 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: bench-collector-logs-config }
        - name: varlogpods
          hostPath: { path: /var/log/pods }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bench-collector-metrics
  namespace: bench-collector
  labels: { app: bench-collector-metrics, engine: otel-collector-contrib }
spec:
  serviceName: bench-collector-metrics
  replicas: 1
  selector:
    matchLabels: { app: bench-collector-metrics }
  template:
    metadata:
      labels: { app: bench-collector-metrics, engine: otel-collector-contrib }
    spec:
      serviceAccountName: bench-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: [ "--config=/conf/config.yaml" ]
          env:
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp, key: apiToken } }
          ports:
            - { name: metrics, containerPort: 8888 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: bench-collector-metrics-config }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-collector-traces
  namespace: bench-collector
  labels: { app: bench-collector-otlp, engine: otel-collector-contrib }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bench-collector-otlp }
  template:
    metadata:
      labels: { app: bench-collector-otlp, engine: otel-collector-contrib }
    spec:
      serviceAccountName: bench-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: [ "--config=/conf/config.yaml" ]
          env:
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp, key: apiToken } }
          ports:
            - { name: metrics, containerPort: 8888 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: bench-collector-traces-config }
---
apiVersion: v1
kind: Service
metadata:
  name: bench-collector-otlp
  namespace: bench-collector
  labels: { app: bench-collector-otlp }
spec:
  selector: { app: bench-collector-otlp }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
